[project]
name = "backend"
version = "0.1.0"
description = "Backend - Atencao ao Idoso"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "alembic",
    "itsdangerous",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
