services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: atencao_idoso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d atencao_idoso"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://user:pass@db:5432/atencao_idoso
      CORS_ORIGIN: http://localhost:8080
      SESSION_SECRET_KEY: changeme
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
