databases:
  - name: atencao-idoso-db
    databaseName: atencao_idoso
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: atencao-idoso-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atencao-idoso-db
          property: connectionString
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
